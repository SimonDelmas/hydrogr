[package]
name = "hydrogr"
version = "1.2.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "hydrogr"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.15.6"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
